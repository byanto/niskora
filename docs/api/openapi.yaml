openapi: 3.1.0
info:
  title: niskora API
  version: "1"
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Up
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Not up
      summary: Whether the backend is up
  /api/identity/session:
    delete:
      operationId: logOut
      responses:
        "204":
          description: No Content
      tags:
      - session-controller
    get:
      operationId: currentSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
      tags:
      - session-controller
    post:
      operationId: logIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
      tags:
      - session-controller
  /api/identity/users:
    get:
      operationId: listUsers
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - in: query
        name: sort
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedListUserResponse"
          description: OK
      tags:
      - users-controller
    post:
      operationId: createUser
      parameters:
      - description: Made once per user intent and sent again on a retry of it (ENG-85).
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
      tags:
      - users-controller
  /api/identity/users/{id}:
    get:
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - users-controller
  /api/identity/users/{id}/change-password:
    post:
      operationId: changePassword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Made once per user intent and sent again on a retry of it (ENG-85).
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - description: The ETag of the version this change is based on (ENG-87).
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - users-controller
  /api/identity/users/{id}/disable:
    post:
      operationId: disableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Made once per user intent and sent again on a retry of it (ENG-85).
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - description: The ETag of the version this change is based on (ENG-87).
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - users-controller
  /api/identity/users/{id}/enable:
    post:
      operationId: enableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Made once per user intent and sent again on a retry of it (ENG-85).
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - description: The ETag of the version this change is based on (ENG-87).
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - users-controller
  /api/identity/users/{id}/reset-password:
    post:
      operationId: resetPassword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Made once per user intent and sent again on a retry of it (ENG-85).
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      - description: The ETag of the version this change is based on (ENG-87).
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - users-controller
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      required:
      - status
    LoginRequest:
      type: object
      properties:
        loginName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - loginName
      - password
    NewUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        loginName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - fullName
      - loginName
      - password
    PagedListUserResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
      - data
      - pagination
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 1
      required:
      - currentPassword
      - newPassword
    PasswordResetRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
      - password
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
      - user
    SessionUser:
      type: object
      properties:
        fullName:
          type: string
        id:
          type: string
          format: uuid
        loginName:
          type: string
      required:
      - fullName
      - id
      - loginName
    UserResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        fullName:
          type: string
        id:
          type: string
          format: uuid
        isDisabled:
          type: boolean
        loginName:
          type: string
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - fullName
      - id
      - isDisabled
      - loginName
      - version
