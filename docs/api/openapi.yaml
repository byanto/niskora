openapi: 3.1.0
info:
  title: niskora API
  version: "1"
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Up
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Not up
      summary: Whether the backend is up
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      required:
      - status
