openapi: 3.1.0
info:
  title: niskora API
  version: "1"
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Up
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Not up
      summary: Whether the backend is up
  /api/identity/session:
    delete:
      operationId: logOut
      responses:
        "204":
          description: No Content
      tags:
      - session-controller
    get:
      operationId: currentSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
      tags:
      - session-controller
    post:
      operationId: logIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
      tags:
      - session-controller
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      required:
      - status
    LoginRequest:
      type: object
      properties:
        loginName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - loginName
      - password
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
      - user
    SessionUser:
      type: object
      properties:
        fullName:
          type: string
        id:
          type: string
          format: uuid
        loginName:
          type: string
      required:
      - fullName
      - id
      - loginName
