# The stack every environment shares (PLT-1, PLT-11). It publishes no port and holds no password:
# the services reach each other by name on Compose's own network.
# Locally, `docker compose up` also loads compose.override.yaml, which adds the ports and the
# development passwords. Then open http://localhost:8000.
# An installation runs this file from the commit it deploys, with its own file added by -f instead
# of the override, and supplies every password itself (PLT-10). One it leaves out stops the stack
# from starting.
name: niskora

services:
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: niskora
      POSTGRES_USER: niskora
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niskora -d niskora"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/niskora
      SPRING_DATASOURCE_USERNAME: niskora
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build: ./frontend
    depends_on:
      - backend

volumes:
  postgres-data:
