# The merge gate (ENG-46) and image publishing (PLT-7). It holds the ENG-47 checks that exist so
# far; later tickets add theirs. The breaking-change check (ENG-91) is in api.yml. Every push to a
# pull request runs the checks, including a build of both images without pushing them. A merge to
# main runs the checks again and, when they pass, pushes the linux/arm64 images (ENG-5) to
# GitHub's container registry, tagged by commit hash (ENG-57). No step retries a failed test
# (ENG-41).
# Actions are pinned by digest (ENG-53); the comment after each is the release it points at.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to a pull request makes the older run pointless. On main each commit has its own
  # group, so no run is cancelled or dropped from the queue and every merged commit gets its images.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Testcontainers uses the runner's own Docker.
      - run: ./mvnw -B verify
      # The OpenAPI drift check (ENG-89): the build regenerates the OpenAPI document, and the module
      # diagram with it, so any difference from what is committed fails here.
      - name: Generated files are committed
        run: |
          git status --porcelain
          git --no-pager diff
          test -z "$(git status --porcelain)"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm named by packageManager in package.json and Node 24, then runs a frozen
      # install.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: frontend
          runtime: node@24
          cache: true
          require-lockfile: true
      # The OpenAPI drift check (ENG-89): pnpm check regenerates the API types from the committed
      # OpenAPI document, so any difference from the committed types fails here.
      - run: pnpm check
      - name: Generated files are committed
        run: |
          git status --porcelain
          git --no-pager diff
          test -z "$(git status --porcelain)"

  # The Playwright journeys (ENG-39) in a real browser against the whole Compose stack, built from
  # this commit, with an account made by the first-user command (PLT-18).
  journeys:
    name: Journeys
    # The production platform (ENG-5), so the stack reads the arm64 layers that the Image and
    # Publish jobs cache. Without them every run fetches Maven and every dependency from Maven
    # Central again, which fails whenever Central rate-limits the runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: frontend
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds the stack's images from compose.yaml under the names Compose gives them, reading
      # the image jobs' cache without writing to it.
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            backend.tags=niskora-backend
            backend.cache-from=type=gha,scope=backend
            caddy.tags=niskora-caddy
            caddy.cache-from=type=gha,scope=frontend
      - name: Start the stack
        run: docker compose up --detach --no-build --wait
      # The account named in frontend/e2e/account.ts. The password goes in on standard input, as
      # it does on the server.
      - name: Create the account
        run: |
          echo "journey password" | docker compose exec -T backend \
            java -jar app.jar create-first-user --login-name=journey --full-name="Journey Tester"
      - name: Wait for the backend
        run: |
          for attempt in $(seq 60); do
            curl --fail --silent http://localhost:8000/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: Install the browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the journeys
        working-directory: frontend
        run: pnpm e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Pull requests: both images must build. They run beside the tests, not after them.
  images:
    name: Image
    if: github.event_name == 'pull_request'
    # An ARM runner builds linux/arm64 natively, with no emulation.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # main: the images are pushed only once the checks passed on the same commit.
  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [backend, frontend, journeys]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
          # The backend sends it on every response (ENG-92) and the frontend compares it (FE-82).
          build-args: BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
