# Pull request titles follow Conventional Commits (ENG-55). The title becomes the squash commit
# on main (ENG-54); commits inside a branch are free-form and not checked.
# pull_request_target runs in the context of main and never checks out the pull request's code,
# so the token it holds is never exposed to that code.
name: PR title

on:
  pull_request_target:
    # synchronize as well, so the required check reports on every push.
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
