spring:
  application:
    name: niskora
  # The datasource comes from SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD (see compose.yaml).
  jpa:
    # Flyway owns the schema; Hibernate only checks that it matches (ENG-63).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # Moments are stored in UTC whatever zone the machine runs in (ENG-64).
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Each module keeps its migrations in db/migration/<module>/ (ENG-60).
    locations: classpath:db/migration
    clean-disabled: true

springdoc:
  api-docs:
    # The OpenAPI document is generated by OpenApiDocumentTest and committed (ENG-89), never served.
    enabled: false
    version: openapi_3_1
  # The API is everything under /api (ENG-68), and nothing else, such as the error page, is part of it.
  paths-to-match: /api/**
  # A stable order, so the committed document changes only when the API does.
  writer-with-order-by-keys: true

server:
  servlet:
    session:
      # The server-side session lives in a cookie only, never in a URL (PLT-12, FE-74). TLS ends
      # in front of the stack (PLT-6), and browsers accept a Secure cookie from http://localhost too.
      tracking-modes: cookie
      cookie:
        secure: true
        http-only: true
        same-site: lax

niskora:
  # Sent on every response (ENG-92). The image sets NISKORA_BUILD_ID to the commit hash.
  build-id: dev

logging:
  structured:
    # One JSON object per line on stdout (PLT-29, PLT-11).
    format:
      console: ecs

management:
  server:
    # Actuator answers only on this internal port, which is never published to the internet.
    # Caddy forwards the one public health path to it (ENG-68).
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # A bare {"status":"UP"} or "DOWN", with no components, details or group names (PLT-31).
      show-components: never
      show-details: never
      probes:
        enabled: false
